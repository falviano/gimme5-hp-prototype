<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scelta Piano – Gimme5</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 24px 16px;
    }

    /* Phone frame */
    .phone {
      width: 375px;
      height: 812px;
      background: #ebebeb;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,.55), 0 0 0 10px #111;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      background: #ebebeb;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 4px;
      flex-shrink: 0;
    }
    .status-time {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #000;
      width: 54px;
      text-align: center;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    /* Nav bar */
    .nav-bar {
      height: 52px;
      background: #ebebeb;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .nav-back {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 24px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 0 28px;
    }
    .icon-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      background: #fff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .check-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 28px;
      height: 28px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #ebebeb;
    }
    .welcome-label {
      font-size: 12px;
      font-weight: 600;
      color: #5c5c5c;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hero-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #000;
      margin-bottom: 12px;
    }
    .hero-sub {
      font-size: 15px;
      font-weight: 400;
      color: #5c5c5c;
      line-height: 1.6;
      max-width: 270px;
    }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
      text-align: left;
      width: 100%;
    }
    .card:active { opacity: 0.65; }
    .card.highlight {
      background: #fef4f0;
      border-color: #fad5c5;
    }

    .icon-box {
      width: 52px;
      height: 52px;
      background: #f2f2f2;
      border-radius: 14px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card.highlight .icon-box {
      background: #f2f2f2;
    }

    .card-text { flex: 1; min-width: 0; }
    .card-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 600;
      font-size: 16px;
      line-height: 20px;
      color: #0f0f0f;
      margin-bottom: 3px;
    }
    .card.highlight .card-title { color: #c94a18; }
    .card-desc {
      font-size: 13px;
      font-weight: 400;
      color: #5c5c5c;
      line-height: 1.45;
    }

    .chevron { flex-shrink: 0; }

    /* Home indicator */
    .home-bar {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      flex-shrink: 0;
    }
    .home-pill {
      width: 134px;
      height: 5px;
      background: #000;
      border-radius: 999px;
      opacity: 0.18;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-time">9:41</div>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
        <rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/>
        <rect x="4.5" y="5" width="3" height="6" rx="0.5" fill="#000"/>
        <rect x="9" y="2.5" width="3" height="8.5" rx="0.5" fill="#000"/>
        <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#000"/>
      </svg>
      <!-- WiFi -->
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M7.5 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5z" fill="#000"/>
        <path d="M4.11 7.36C4.79 6.54 5.95 5.98 7.5 5.98c1.55 0 2.71.56 3.39 1.38" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M1.5 4.86C2.83 3.36 4.87 3 7.5 3s4.67.36 6 1.86" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <!-- Battery -->
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#000" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="18" height="8" rx="1" fill="#000"/>
        <path d="M23 4v4.5c.83-.35 1.5-1.33 1.5-2.25S23.83 4.35 23 4z" fill="#000" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Nav bar -->
  <div class="nav-bar">
    <div class="nav-back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Hero -->
    <div class="hero">
      <div class="icon-wrap">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f55a27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <div class="check-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
      <div class="welcome-label">Benvenuto!</div>
      <div class="hero-title">Account creato!</div>
      <div class="hero-sub">Come vuoi procedere per configurare il tuo piano di investimento?</div>
    </div>

    <!-- Cards -->
    <div class="cards">

      <!-- Card 1 -->
      <button class="card">
        <div class="icon-box">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f55a27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            <polyline points="16 7 22 7 22 13"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Investi con l'aiuto di esperti</div>
          <div class="card-desc">Gestiamo per te un portafoglio in linea con i tuoi obiettivi</div>
        </div>
        <div class="chevron">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </div>
      </button>

      <!-- Card 2 -->
      <button class="card">
        <div class="icon-box">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f55a27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 8 12 12 15 14"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Crea il piano di accumulo</div>
          <div class="card-desc">Automatizza i risparmi con versamenti regolari nel tempo</div>
        </div>
        <div class="chevron">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </div>
      </button>

      <!-- Card 3 highlight -->
      <button class="card highlight">
        <div class="icon-box">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f55a27" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="3" x2="12" y2="5.5"/>
            <line x1="12" y1="18.5" x2="12" y2="21"/>
            <line x1="3" y1="12" x2="5.5" y2="12"/>
            <line x1="18.5" y1="12" x2="21" y2="12"/>
            <polygon points="12,8.5 14.2,13 9.8,13" fill="#f55a27" stroke="none"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Non sai da dove iniziare?</div>
          <div class="card-desc">Rispondi a qualche domanda e scopri il prodotto più adatto a te</div>
        </div>
        <div class="chevron">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#f55a27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </div>
      </button>

    </div>
  </div>

  <!-- Home indicator -->
  <div class="home-bar">
    <div class="home-pill"></div>
  </div>

</div>

</body>
</html>
