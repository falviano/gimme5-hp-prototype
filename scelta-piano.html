<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scelta Piano – Gimme5</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 24px 16px;
    }

    .phone {
      width: 375px;
      height: 812px;
      background: #ebebeb;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,.55), 0 0 0 10px #111;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      background: #ebebeb;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 4px;
      flex-shrink: 0;
    }
    .status-time {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #000;
      width: 54px;
      text-align: center;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    /* Nav bar */
    .nav-bar {
      height: 52px;
      background: #ebebeb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }
    .nav-back {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .nav-title {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 14px;
      font-weight: 500;
      color: #000;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 24px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Header / hero */
    .header {
      padding: 12px 0 20px;
    }
    .icon-wrap {
      position: relative;
      width: 72px; height: 72px;
      background: #fff;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .check-badge {
      position: absolute;
      bottom: -4px; right: -4px;
      width: 24px; height: 24px;
      background: #22c55e;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #ebebeb;
    }
    .hero-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #000;
      margin-bottom: 8px;
    }
    .hero-sub {
      font-size: 16px;
      font-weight: 400;
      color: #5c5c5c;
      line-height: 1.6;
    }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      border: none;
      transition: opacity 0.15s;
    }
    .card:active { opacity: 0.65; }

    /* Icon box – esatto stile screenshot: bianco con bordo grigio */
    .icon-box {
      width: 44px; height: 44px;
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #d0d0d0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .card-text { flex: 1; min-width: 0; }
    .card-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.25;
      color: #0f0f0f;
      margin-bottom: 3px;
    }
    .card-desc {
      font-size: 13px;
      font-weight: 400;
      color: #5c5c5c;
      line-height: 1.4;
    }
    .chevron { flex-shrink: 0; }

    /* Home indicator */
    .home-bar {
      height: 34px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 8px; flex-shrink: 0;
    }
    .home-pill {
      width: 134px; height: 5px;
      background: #000; border-radius: 999px; opacity: 0.18;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-time">9:41</div>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
        <rect x="0" y="7" width="3" height="4" rx="0.5" fill="#000"/>
        <rect x="4.5" y="5" width="3" height="6" rx="0.5" fill="#000"/>
        <rect x="9" y="2.5" width="3" height="8.5" rx="0.5" fill="#000"/>
        <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#000"/>
      </svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M7.5 10.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5z" fill="#000"/>
        <path d="M4.11 7.36C4.79 6.54 5.95 5.98 7.5 5.98c1.55 0 2.71.56 3.39 1.38" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M1.5 4.86C2.83 3.36 4.87 3 7.5 3s4.67.36 6 1.86" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#000" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="18" height="8" rx="1" fill="#000"/>
        <path d="M23 4v4.5c.83-.35 1.5-1.33 1.5-2.25S23.83 4.35 23 4z" fill="#000" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Nav bar -->
  <div class="nav-bar">
    <div class="nav-back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
    </div>
    <div class="nav-title">Piano d'investimento</div>
    <div style="width:24px"></div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Header -->
    <div class="header">
      <div class="icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f55a27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <div class="check-badge">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
      <div class="hero-title">Account creato!</div>
      <div class="hero-sub">Come vuoi procedere per configurare il tuo piano di investimento?</div>
    </div>

    <!-- Cards -->
    <div class="cards">

      <!-- 1. Investi con l'aiuto di esperti -->
      <button class="card">
        <div class="icon-box">
          <!-- Trending up arrow – identico allo screenshot -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            <polyline points="16 7 22 7 22 13"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Investi con l'aiuto di esperti</div>
          <div class="card-desc">Gestiamo per te un portafoglio in linea con i tuoi obiettivi</div>
        </div>
        <div class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </div>
      </button>

      <!-- 2. Crea il piano di accumulo -->
      <button class="card">
        <div class="icon-box">
          <!-- Piggy bank / accumulo con cerchio + segno + -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2"/>
            <path d="M12 2a10 10 0 1 0 10 10"/>
            <path d="M18 2v4M16 4h4"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Crea il piano di accumulo</div>
          <div class="card-desc">Automatizza i risparmi con versamenti regolari nel tempo</div>
        </div>
        <div class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </div>
      </button>

      <!-- 3. Non sai da dove iniziare -->
      <button class="card">
        <div class="icon-box">
          <!-- Compass / bussola -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="#1a1a1a" stroke="none"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Non sai da dove iniziare?</div>
          <div class="card-desc">Rispondi a qualche domanda e scopri il prodotto più adatto a te</div>
        </div>
        <div class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </div>
      </button>

    </div>
  </div>

  <!-- Home indicator -->
  <div class="home-bar">
    <div class="home-pill"></div>
  </div>

</div>

</body>
</html>
